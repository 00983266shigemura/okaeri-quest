name: 動画一覧の自動更新

# 毎日1回、各チャンネルの新着を取り込んで index.html を更新する。
# 変更が無い日は何もコミットしない。
on:
  schedule:
    # 20:00 UTC = 翌 05:00 日本時間（子どもが使う夕方より前に更新しておく）
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 動画一覧を最新化
        run: python3 tools/update_video_lists.py

      - name: 祝日一覧を最新化
        # 祝日の取得に失敗しても、動画の更新は止めない（祝日は前回の値が残る＝安全側）
        continue-on-error: true
        run: python3 tools/update_holidays.py

      - name: 変更があればコミットして公開
        # videos_pool.json も必ず一緒にコミットする。
        # これを忘れると、ためた動画が翌朝ぜんぶ失われ、一覧が15本へ戻ってしまう。
        run: |
          if git diff --quiet -- index.html videos_pool.json && [ -z "$(git status --porcelain -- videos_pool.json)" ]; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name "okaeri-quest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html videos_pool.json
          git commit -m "動画・祝日の一覧を自動更新"
          git push
